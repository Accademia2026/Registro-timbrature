    /* ---------- Registro: riga compatta + editor a scomparsa ---------- */
    function rigaTimes(key,e){
      const beh=ACTBY[e.act]?.beh;
      let pezzi=[];
      if(e.act && e.act!=='presenza'){
        pezzi.push('<span class="chip-mini'+(beh==='day'?' chip-fer':'')+'">'+esc(ACTBY[e.act].label)+'</span>');
      }
      if(beh==='work'||beh==='hour'||beh==='special'||!e.act){
        const s1=(e.m1in||e.m1out)?((e.m1in||'··')+'→'+(e.m1out||'··')):null;
        const s2=(e.m2in||e.m2out)?((e.m2in||'··')+'→'+(e.m2out||'··')):null;
        if(s1)pezzi.push(s1);
        if(s2)pezzi.push(s2);
        if(!s1&&!s2&&!e.act)pezzi.push('<span class="muted">––:––</span>');
        if(beh==='hour'&&e.ph)pezzi.push('perm '+fmtHM(e.ph));
      }
      const st=dayStudyMin(key,e);
      if(st>0)pezzi.push('st '+fmtHM(st));
      if(e.note)pezzi.push('✎');
      return pezzi.join(' · ');
    }
    function rigaTot(key,e){
      if(!e.act)return '<span class="muted">—</span>';
      const expected=expectedFor(key);
      const beh=ACTBY[e.act]?.beh;
      const showSu=(beh==='work'||beh==='hour'||beh==='special')&&expected>0;
      return fmtHM(dayMinutes(key,e))+(showSu?'<small>su '+fmtHM(expected)+'</small>':'');
    }
    function editorGiorno(key,e){
      const beh=ACTBY[e.act]?.beh, expected=expectedFor(key);
      const showTimes=beh==='work'||beh==='hour'||beh==='special'||(!e.act&&expected>0);
      const showPh=beh==='hour';
      const sp1=(t2m(e.m1in)!=null&&t2m(e.m1out)!=null)?Math.max(0,t2m(e.m1out)-t2m(e.m1in)):null;
      const sp2=(t2m(e.m2in)!=null&&t2m(e.m2out)!=null)?Math.max(0,t2m(e.m2out)-t2m(e.m2in)):null;
      const opts='<option value="">— seleziona —</option>'+ACT.map(a=>'<option value="'+a.id+'" '+(e.act===a.id?'selected':'')+'>'+a.label+'</option>').join('');
      const tbtn=(f)=>'<button class="input input--time tinput '+(e[f]?'':'is-empty')+'" data-k="'+key+'" data-f="'+f+'" data-val="'+(e[f]||'')+'">'+(e[f]||'––:––')+'</button>';
      let x='<div class="dopen-r1"><select class="act-sel" data-k="'+key+'" data-f="act">'+opts+'</select>'
        +(studyDefaultFor(key)>0?'<span class="badge-st">Studio '+fmtHM(studyDefaultFor(key))+'</span>':'')
        +'<button class="idanger dsm" data-removeday="'+key+'" style="margin-left:auto">Rimuovi</button></div>';
      if(showTimes){
        x+='<div class="punch">'+tbtn('m1in')+'<span class="punch__arrow">→</span>'+tbtn('m1out')+(sp1!=null?'<span class="punch__dur">'+fmtHM(sp1)+'</span>':'')+'</div>';
        x+='<div class="punch">'+tbtn('m2in')+'<span class="punch__arrow">→</span>'+tbtn('m2out')+(sp2!=null?'<span class="punch__dur">'+fmtHM(sp2)+'</span>':'')+'</div>';
      }
      if(showPh){
        x+='<div class="phfield"><span class="muted">Ore permesso</span><input class="note" style="width:90px" type="number" min="0" step="0.25" data-k="'+key+'" data-f="phh" value="'+(e.ph!=null?(e.ph/60):'')+'" placeholder="es. 2"></div>';
      }
      x+='<input class="note" type="text" data-k="'+key+'" data-f="note" value="'+((e.note||'').replace(/"/g,'&quot;'))+'" placeholder="Note (facoltative)">';
      const wI=dayWorkInfo(key,e);
      if(wI.deducted>0){const parts=[];if(wI.pw.autoBreak>0)parts.push('pausa '+fmtHM(wI.pw.autoBreak));if(wI.capped>0)parts.push('tetto 9h');x+='<div class="day__note">−'+fmtHM(wI.deducted)+' · '+parts.join(' + ')+'</div>';}
      return x;
    }
    function renderRegistro(){
      if(!weekCursor) weekCursor=iso(mondayOf(new Date()));
      const mon=parseISO(weekCursor), sun=addDays(mon,6);
      const obl=obligationForWeek(weekCursor), tot=weekTotal(weekCursor), c=tot-obl;
      const esitoCls = c>0?'over':(c<0?'under':'ok');
      const esitoTxt = c>0?'😎 Eccedenza':(c<0?'⚠️ Sotto soglia':'✅ In pari');
      const range = mon.getMonth()===sun.getMonth()
          ? mon.getDate()+'–'+sun.getDate()+' '+MONTHS[sun.getMonth()]
          : mon.getDate()+' '+MONTHS[mon.getMonth()].slice(0,3)+' – '+sun.getDate()+' '+MONTHS[sun.getMonth()].slice(0,3);

      const todayISO=iso(new Date());
      /* prima apertura sulla settimana corrente: si apre il giorno di oggi */
      if(openDay===null && iso(mondayOf(new Date()))===weekCursor) openDay=todayISO;
      let days='';
      for(let i=0;i<6;i++){ /* lun-sab: la domenica non si mostra */
        const dd=addDays(mon,i), key=iso(dd), e=DB.entries[key]||{};
        const expected=expectedFor(key);
        const skipped=isSkipped(key);
        const naturalRest = expected===0;
        const isToday = key===todayISO;
        const dstr=pad(dd.getDate())+'/'+pad(dd.getMonth()+1);
        const nomeG='<div class="dcol"><b>'+DAYNAMES[i].slice(0,3)+(isToday?'<i class="oggi-dot"></i>':'')+'</b><span>'+dstr+'</span></div>';
        if(skipped){
          days+='<div class="drow drow--off"><span class="kl" style="background:var(--line)"></span>'+nomeG
            +'<span class="dtimes muted">Rimosso</span>'
            +'<button class="ilink dsm" data-restore="'+key+'">Ripristina</button></div>';
        } else if(naturalRest && !hasEntry(e)){
          days+='<div class="drow drow--off"><span class="kl" style="background:var(--line)"></span>'+nomeG
            +'<span class="dtimes muted" style="font-style:italic">Riposo</span>'
            +'<button class="ilink dsm" data-unlock="'+key+'">+ straord.</button></div>';
        } else {
          const aperto=openDay===key;
          const accent=e.act?actAccent(e.act):'var(--line-strong)';
          days+='<div class="drow'+(isToday?' drow--oggi':'')+(aperto?' drow--sel':'')+'" data-open="'+key+'">'
            +'<span class="kl" style="background:'+accent+'"></span>'+nomeG
            +'<span class="dtimes">'+rigaTimes(key,e)+'</span>'
            +'<span class="atot">'+rigaTot(key,e)+'</span>'
          +'</div>';
          if(aperto) days+='<div class="dopen">'+editorGiorno(key,e)+'</div>';
        }
      }

      const excessMin=Math.max(0,c), authMin=authForWeek(weekCursor);
      let authBar='';
      if(c>0){
        if(authEditWeek===weekCursor){
          const dh=Math.floor((authMin||excessMin)/60), dmn=(authMin||excessMin)%60;
          authBar='<div class="authbox"><span><b>Straordinario autorizzato</b> (max '+fmtHM(excessMin)+'):</span>'
            +'<input type="number" id="authH" min="0" max="'+Math.floor(excessMin/60)+'" value="'+dh+'">h'
            +'<input type="number" id="authM" min="0" max="59" value="'+dmn+'">m'
            +'<button class="ios-btn" id="authSave">Conferma</button><button class="ilink" id="authCancel">Annulla</button></div>';
        } else if(authMin>0){
          authBar='<div class="authbox"><span>\u2713 <b>'+fmtHM(authMin)+'</b> di straordinario autorizzato nel monte \u00b7 eccedenza '+fmtHM(excessMin)+'</span><span style="flex:1"></span>'
            +'<button class="ilink" id="authEdit">Modifica</button><button class="idanger" id="authRemove">Rimuovi</button></div>';
        } else {
          authBar='<div class="authbox"><span>Hai <b>'+fmtHM(excessMin)+'</b> di ore eccedenti: sono straordinario autorizzato?</span><span style="flex:1"></span>'
            +'<button class="ios-btn" id="authAdd">S\u00ec, nel monte</button></div>';
        }
      }

      const wkDays=[]; for(let i=0;i<7;i++){const dd=addDays(mon,i);if(expectedFor(iso(dd))>0)wkDays.push(iso(dd));}
      const allSkipped = wkDays.length>0 && wkDays.every(k=>isSkipped(k));
      const weekActions = '<div class="linkrow" style="margin:0 16px">'+( allSkipped
          ? '<span class="muted">Settimana rimossa.</span><button class="ilink" id="waRestore">Ripristina settimana</button>'
          : '<span class="muted">Azioni settimana:</span><button class="ilink" id="waFerie">Tutta ferie</button><button class="idanger" id="waRemove">Rimuovi settimana</button>' )+'</div>';

      const pctFill=obl?Math.min(100,(Math.min(tot,obl)/obl)*100):0;
      const overPct=tot>obl&&obl?Math.min(35,((tot-obl)/obl)*100):0;
      const goalLeft=obl?Math.min(100,(obl/Math.max(tot,obl))*100):100;

      view.innerHTML=
        '<div class="ios">'
        +'<div class="hero-title"><div><h1 class="large-title">'+range+'</h1><p>Settimana del '+pad(mon.getDate())+'/'+pad(mon.getMonth()+1)+'</p></div>'
          +'<div style="display:flex;gap:6px;align-items:center">'
            +'<label class="navbtn wjump2" title="Vai a una settimana">\ud83d\udcc5<input type="date" id="wJump" value="'+weekCursor+'"></label>'
            +'<button class="navbtn" id="wPrev" aria-label="settimana precedente">\u2039</button>'
            +'<button class="navbtn" id="wToday" style="font-size:13px;padding:0 12px;min-width:auto">Oggi</button>'
            +'<button class="navbtn" id="wNext" aria-label="settimana successiva">\u203a</button>'
          +'</div></div>'
        +'<div class="stack">'
          +'<div class="card"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:start">'
            +'<div><div class="foot muted">Presenza</div><div class="num sum-v" style="font-size:var(--t-title3);font-weight:600">'+fmtHM(tot)+'</div></div>'
            +'<div><div class="foot muted">Dovute</div><div class="num sum-v" style="font-size:var(--t-title3);font-weight:600">'+fmtHM(obl)+'</div></div>'
            +'<div><div class="foot muted">Credito</div><div class="num sum-v '+(c<0?'neg':(c>0?'pos':''))+'" style="font-size:var(--t-title3);font-weight:600">'+fmtHM(c,true)+'</div></div>'
            +'<div><div class="foot muted">Studio</div><div class="num" id="sumStudio" style="font-size:var(--t-title3);font-weight:600">'+fmtHM(weekStudy(weekCursor))+'</div></div>'
          +'</div>'
          +'<div style="display:flex;align-items:center;gap:12px;margin-top:14px">'
            +'<span class="meter" style="flex:1"><span class="meter__fill '+(c>0?'meter__fill--pos':(c<0?'meter__fill--neg':''))+'" style="width:'+Math.min(100,pctFill+overPct)+'%"></span><span class="meter__goal" style="left:'+goalLeft+'%"></span></span>'
            +'<span class="badge sum-esito esito-badge '+(c>0?'badge--pos':(c<0?'badge--neg':''))+'">'+(c>0?'Eccedenza':(c<0?'Sotto soglia':'In pari'))+'</span>'
          +'</div>'
          +'</div>'
          +authBar
          +weekActions
          +'<div class="card" id="dlist" style="padding:0;overflow:hidden">'+days+'</div>'
        +'</div>'
        +'</div>';

      document.getElementById('wJump').onchange=e=>{if(e.target.value){weekCursor=iso(mondayOf(parseISO(e.target.value)));renderRegistro();}};
      document.getElementById('wPrev').onclick=()=>{weekCursor=iso(addDays(mon,-7));renderRegistro();};
      document.getElementById('wNext').onclick=()=>{weekCursor=iso(addDays(mon,7));renderRegistro();};
      document.getElementById('wToday').onclick=()=>{weekCursor=iso(mondayOf(new Date()));renderRegistro();};
      view.querySelectorAll('.drow[data-open]').forEach(r=>r.onclick=ev=>{
        if(ev.target.closest('button,select,input'))return;
        const k=r.dataset.open;
        openDay=(openDay===k?'__chiuso':k);
        renderRegistro();
      });
      view.querySelectorAll('[data-k]').forEach(el=>{
        if(el.classList.contains('tinput')){
          el.addEventListener('click',()=>openKeypad(el));
        } else {
          const ev = el.tagName==='SELECT'?'change':'input';
          el.addEventListener(ev,onEntryChange);
        }
      });
      view.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>{
        const key=b.dataset.unlock;
        DB.entries[key]={act:'straordinario'};
        saveDay(key); refreshChip(); renderRegistro();
      });
      view.querySelectorAll('[data-removeday]').forEach(b=>b.onclick=()=>{
        const key=b.dataset.removeday;
        if(!confirm('Rimuovere questo giorno come giornata lavorativa? Eventuali orari inseriti verranno cancellati e il giorno non peserà sull\'obbligo settimanale.'))return;
        DB.skipDays[key]=true; delete DB.entries[key];
        saveDay(key); refreshChip(); renderRegistro();
      });
      view.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{
        const k=b.dataset.restore;
        delete DB.skipDays[k];
        saveDay(k); refreshChip(); renderRegistro();
      });
      const waRemove=document.getElementById('waRemove'); if(waRemove)waRemove.onclick=()=>{
        if(!confirm('Rimuovere l\'intera settimana come giornate lavorative? Gli orari inseriti verranno cancellati e la settimana non peserà sull\'obbligo.'))return;
        for(let i=0;i<7;i++){const dd=addDays(mon,i),k=iso(dd); if(expectedFor(k)>0){DB.skipDays[k]=true;delete DB.entries[k];saveDay(k);}}
        delete DB.authorized[weekCursor]; saveAuth(weekCursor); refreshChip(); renderRegistro();
      };
      const waRestore=document.getElementById('waRestore'); if(waRestore)waRestore.onclick=()=>{
        for(let i=0;i<7;i++){const k=iso(addDays(mon,i)); if(DB.skipDays[k]){delete DB.skipDays[k]; saveDay(k);}}
        refreshChip(); renderRegistro();
      };
      const waFerie=document.getElementById('waFerie'); if(waFerie)waFerie.onclick=()=>{
        if(!confirm('Impostare tutti i giorni lavorativi della settimana come Ferie? Sovrascrive le voci esistenti.'))return;
        for(let i=0;i<7;i++){const dd=addDays(mon,i),k=iso(dd); if(expectedFor(k)>0){delete DB.skipDays[k];DB.entries[k]={act:'ferie'};saveDay(k);}}
        refreshChip(); renderRegistro();
      };
      const aAdd=document.getElementById('authAdd'); if(aAdd)aAdd.onclick=()=>{authEditWeek=weekCursor;renderRegistro();};
      const aEdit=document.getElementById('authEdit'); if(aEdit)aEdit.onclick=()=>{authEditWeek=weekCursor;renderRegistro();};
      const aRem=document.getElementById('authRemove'); if(aRem)aRem.onclick=()=>{delete DB.authorized[weekCursor];authEditWeek=null;saveAuth(weekCursor);refreshChip();renderRegistro();};
      const aCancel=document.getElementById('authCancel'); if(aCancel)aCancel.onclick=()=>{authEditWeek=null;renderRegistro();};
      const aSave=document.getElementById('authSave'); if(aSave)aSave.onclick=()=>{
        let h=parseInt(document.getElementById('authH').value,10); if(isNaN(h)||h<0)h=0;
        let m=parseInt(document.getElementById('authM').value,10); if(isNaN(m)||m<0)m=0; if(m>59)m=59;
        let total=Math.min(h*60+m, excessMin);
        if(total>0)DB.authorized[weekCursor]=total; else delete DB.authorized[weekCursor];
        authEditWeek=null; saveAuth(weekCursor); refreshChip(); renderRegistro();
      };
    }
    function recalcWeekLive(el,key,e){
      const obl=obligationForWeek(weekCursor), tot=weekTotal(weekCursor), c=tot-obl;
      const sums=view.querySelectorAll('.sum-v');
      if(sums[0]){sums[0].textContent=fmtHM(tot); sums[1].textContent=fmtHM(obl); sums[2].textContent=fmtHM(c,true); sums[2].className='num sum-v '+(c<0?'neg':(c>0?'pos':''));}
      const st=document.getElementById('sumStudio'); if(st)st.textContent=fmtHM(weekStudy(weekCursor));
      const esEl=view.querySelector('.sum-esito');
      if(esEl){esEl.className='badge sum-esito esito-badge '+(c>0?'badge--pos':(c<0?'badge--neg':''));esEl.textContent=c>0?'Eccedenza':(c<0?'Sotto soglia':'In pari');}
      /* aggiorna la riga compatta del giorno che si sta modificando */
      const row=view.querySelector('.drow[data-open="'+key+'"]');
      if(row){
        const tEl=row.querySelector('.atot'); if(tEl)tEl.innerHTML=rigaTot(key,e||{});
        const sEl=row.querySelector('.dtimes'); if(sEl)sEl.innerHTML=rigaTimes(key,e||{});
      }
      refreshChip();
    }
    /* ---- tastierino orario ---- */
    let kpField=null, kpBuf='';
    const KP_LABELS={m1in:'ingresso mattina',m1out:'uscita mattina',m2in:'ingresso pomeriggio',m2out:'uscita pomeriggio'};
    function kpFmt(b){return b.length>2?b.slice(0,2)+':'+b.slice(2):b;}
    function kpDisplay(b){return b.length===0?'––:––':(b.length===2?b+':':kpFmt(b));}
    function kpApply(v){
      /* scrive il valore sul campo attivo: giorno (Timbrature) o fascia
         oraria (Impostazioni). Le Impostazioni si salvano col loro Salva. */
      kpField.textContent=v||'– –:– –';
      kpField.classList.toggle('is-empty', !v);
      kpField.dataset.val=v;
      if(kpField.dataset.scht!=null){
        updateDay(kpField.dataset.k, +kpField.dataset.pi, +(kpField.dataset.s ?? kpField.dataset.e));
        return;
      }
      const key=kpField.dataset.k,f=kpField.dataset.f;
      const e=DB.entries[key]||(DB.entries[key]={});
      e[f]=v;
      if(!e.act && (e.m1in||e.m1out||e.m2in||e.m2out)) e.act='presenza';
      saveDay(key); recalcWeekLive(kpField,key,e);
    }
    function kpRefresh(){
      const disp=document.getElementById('kpDisp');
      if(disp)disp.textContent=kpDisplay(kpBuf);
      if(kpField) kpApply(kpFmt(kpBuf));
    }
    function bufToTime(b){
      if(!b)return '';
      const hh = b.length===1 ? pad(+b) : b.slice(0,2);
      if(b.length<=2) return hh+':00';
      if(b.length===3) return hh+':'+b[2]+'0';
      return hh+':'+b.slice(2);
    }
    function finalizeField(){
      if(!kpField)return;
      kpApply(bufToTime(kpBuf));
    }
    function openKeypad(el){
      if(kpField&&kpField!==el)finalizeField();
      if(kpField)kpField.classList.remove('is-active');
      kpField=el; el.classList.add('is-active');
      kpBuf=(el.value||el.dataset.val||'').replace(/\D/g,'').slice(0,4);
      const w=document.getElementById('kpWhich');
      if(w){
        if(el.dataset.scht!=null){
          const wd=+(el.dataset.s ?? el.dataset.e);
          const giorno=SD_[IDX_.indexOf(wd)]||'';
          w.textContent=(el.dataset.s!=null?'inizio':'fine')+' · '+giorno+' · '+(el.dataset.k==='pres'?'presenza':'studio');
        } else {
          const dd=parseISO(el.dataset.k);
          w.textContent=(KP_LABELS[el.dataset.f]||'')+' · '+DAYNAMES[(dd.getDay()+6)%7]+' '+pad(dd.getDate())+'/'+pad(dd.getMonth()+1);
        }
      }
      kpRefresh();
      document.getElementById('keypad').classList.add('is-open');
      document.getElementById('kpScrim').classList.add('is-open');
      view.classList.add('kp-open');
    }
    function closeKeypad(){
      finalizeField();
      if(kpField)kpField.classList.remove('is-active');
      kpField=null;
      const k=document.getElementById('keypad'); if(k)k.classList.remove('is-open');
      const sc=document.getElementById('kpScrim'); if(sc)sc.classList.remove('is-open');
      if(view)view.classList.remove('kp-open');
      if(current==='registro')renderRegistro();
    }
    function kpPress(d){
      d=+d;
      const b=kpBuf, len=b.length;
      if(len===0){
        kpBuf = d<=2 ? ''+d : '0'+d;
      } else if(len===1){
        const h1=+b[0];
        if(h1<2) kpBuf=b+d;
        else if(d<=3) kpBuf=b+d;
        else kpBuf='0'+b+(d<=5?''+d:'');
      } else if(len===2){
        if(d<=5) kpBuf=b+d;
      } else if(len===3){
        kpBuf=b+d;
      } else {
        kpBuf=''; kpPress(d); return;
      }
      kpRefresh();
    }
    function kpNow(){ const n=new Date(); kpBuf=pad(n.getHours())+pad(n.getMinutes()); kpRefresh(); }
    function kpStep(delta){
      let base=t2m(kpFmt(kpBuf));
      if(base==null){const n=new Date();base=n.getHours()*60+n.getMinutes();}
      base=(base+delta+1440)%1440;
      kpBuf=pad(Math.floor(base/60))+pad(base%60); kpRefresh();
    }
    function initKeypad(){
      const k=document.getElementById('keypad');
      let g='';
      for(let n=1;n<=9;n++) g+='<button data-d="'+n+'">'+n+'</button>';
      g+='<button class="alt" data-act="clear">C</button><button data-d="0">0</button><button class="alt" data-act="back">⌫</button>';
      k.innerHTML=
        '<div class="grab"></div>'
        +'<div class="kphead">'
          +'<div><div class="kplabel"><b id="kpWhich"></b></div><div class="kpval" id="kpDisp">––:––</div></div>'
          +'<button class="kpnow" data-act="now">Adesso</button>'
        +'</div>'
        +'<div class="kpgrid">'+g+'</div>'
        +'<button class="kpdone" data-act="done">Conferma orario</button>';
      k.addEventListener('click',e=>{
        const b=e.target.closest('button'); if(!b)return;
        if(b.dataset.d!=null)kpPress(b.dataset.d);
        else if(b.dataset.act==='back'){kpBuf=kpBuf.slice(0,-1);kpRefresh();}
        else if(b.dataset.act==='clear'){kpBuf='';kpRefresh();}
        else if(b.dataset.act==='now')kpNow();
        else if(b.dataset.act==='done')closeKeypad();
      });
      const sc=document.getElementById('kpScrim'); if(sc)sc.addEventListener('click',closeKeypad);
    }
    function onEntryChange(ev){
      const el=ev.target, key=el.dataset.k, f=el.dataset.f;
      const e=DB.entries[key]||(DB.entries[key]={});
      if(f==='act'){ e.act=el.value; if(!e.act && e.studyMin==null) delete DB.entries[key]; }
      else if(f==='phh'){ e.ph=el.value===''?null:Math.round(parseFloat(el.value)*60); }
      else if(f==='studyh'){ e.studyMin=el.value===''?0:Math.round(parseFloat(el.value)*60); }
      else { e[f]=el.value; }
      saveDay(key);
      if(f==='act'){ renderRegistro(); refreshChip(); }
      else { recalcWeekLive(el,key,e); }
    }

    /* ---------- Registro attività (calendario) ---------- */
    const H0=8, H1=22, HH=46;
    const PALETTE=['#2f6f5e','#3a5ad6','#b5572a','#7a4fb5','#15807a','#b03a6e','#2d7d46','#9c6b1f','#4754c4','#c0654b'];
    const NOTIFY_OPTS=[['','Nessuno'],['0','All\'inizio'],['5','5 minuti prima'],['10','10 minuti prima'],['15','15 minuti prima'],['30','30 minuti prima'],['60','1 ora prima']];
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const uid=()=>Math.random().toString(36).slice(2,9);
    const personById=id=>DB.people.find(p=>p.id===id);
    function addMin(t,m){let x=t2m(t)+m;x=Math.max(0,Math.min(24*60-1,x));return pad(Math.floor(x/60))+':'+pad(x%60);}

    function eventOccursOn(ev,dISO){
      const d=parseISO(dISO), anchor=parseISO(ev.date);
      if(ev.mode==='weekly'){
        if(d<anchor)return false;
        if(ev.until && d>parseISO(ev.until))return false;
        return d.getDay()===anchor.getDay();
      }
      return ev.date===dISO;
    }
    function dayEventsFor(dISO){return DB.events.filter(ev=>eventOccursOn(ev,dISO));}
    function eventOccurrences(ev,fromISO,toISO){
      if(ev.mode!=='weekly')return (ev.date>=fromISO&&ev.date<=toISO)?[ev.date]:[];
      const res=[];let d=parseISO(ev.date);const to=parseISO(toISO);const until=ev.until?parseISO(ev.until):null;
      while(d<=to){const di=iso(d);if(di>=fromISO&&(!until||d<=until))res.push(di);d=addDays(d,7);}
      return res;
    }
    function layoutDay(evs){
      evs.sort((a,b)=>a.s-b.s||a.e-b.e);
      const cols=[];
      evs.forEach(ev=>{let placed=false;for(let c=0;c<cols.length;c++){if(cols[c]<=ev.s){ev.col=c;cols[c]=ev.e;placed=true;break;}}if(!placed){ev.col=cols.length;cols.push(ev.e);}});
      evs.forEach(ev=>{let mx=1;evs.forEach(o=>{if(o.s<ev.e&&o.e>ev.s)mx=Math.max(mx,o.col+1);});ev.cols=mx;});
    }

    let attTab='calendario';
    function renderAttivita(){
      const seg='<div class="seg">'
         +'<button data-t="calendario" class="'+(attTab==='calendario'?'active':'')+'">Calendario</button>'
         +'<button data-t="ore" class="'+(attTab==='ore'?'active':'')+'">Ore per persona</button>'
         +'<button data-t="persone" class="'+(attTab==='persone'?'active':'')+'">Persone</button>'
       +'</div>';
      let inner = attTab==='calendario'?calendarHTML():attTab==='ore'?hoursHTML():peopleHTML();
      view.innerHTML=seg+inner;
      view.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{attTab=b.dataset.t;renderAttivita();});
      view.querySelectorAll('[data-scheda]').forEach(el=>el.onclick=()=>schedaPersona(el.dataset.scheda));
      if(attTab==='calendario')wireCalendar();
      else if(attTab==='persone')wirePeople();
    }

    function calendarHTML(){
      if(!diaryCursor)diaryCursor=iso(mondayOf(new Date()));
      const mon=parseISO(diaryCursor),sun=addDays(mon,6),todayISO=iso(new Date());
      const range = mon.getMonth()===sun.getMonth()
          ? mon.getDate()+'–'+sun.getDate()+' '+MONTHS[sun.getMonth()]
          : mon.getDate()+' '+MONTHS[mon.getMonth()].slice(0,3)+' – '+sun.getDate()+' '+MONTHS[sun.getMonth()].slice(0,3);
      let head='<div class="ch"></div>', gutter='<div class="cal-gutter">', cols='';
      for(let h=H0;h<H1;h++) gutter+='<div class="hr"><span>'+pad(h)+':00</span></div>';
      gutter+='</div>';
      const presSl=presSlotsForWeek(diaryCursor), studySl=studySlotsForWeek(diaryCursor);
      const bandHTML=(sl,cls)=>{
        if(!sl||!sl.start||!sl.end)return '';
        const s=Math.max(H0*60,t2m(sl.start)??H0*60), e=Math.min(H1*60,t2m(sl.end)??H0*60);
        if(e<=s)return '';
        return '<div class="cal-band '+cls+'" style="top:'+((s-H0*60)/60*HH)+'px;height:'+((e-s)/60*HH)+'px"></div>';
      };
      for(let i=0;i<6;i++){ /* lun-sab */
        const dd=addDays(mon,i),dISO=iso(dd),isT=dISO===todayISO,wd=dd.getDay();
        head+='<div class="ch '+(isT?'today':'')+'"><div class="dn">'+DAYNAMES[i].slice(0,3)+'</div><div class="dd">'+pad(dd.getDate())+'</div></div>';
        let cell='<div class="cal-col '+(isT?'today':'')+'" data-date="'+dISO+'">';
        cell+=bandHTML(presSl[wd],'pres')+bandHTML(studySl[wd],'study');
        for(let h=H0;h<H1;h++) cell+='<div class="hr"></div>';
        const evs=dayEventsFor(dISO).map(ev=>({ev,s:Math.max(H0*60,t2m(ev.start)),e:Math.min(H1*60,t2m(ev.end))})).filter(o=>o.e>o.s);
        layoutDay(evs);
        evs.forEach(o=>{
          const top=(o.s-H0*60)/60*HH, hgt=Math.max(18,(o.e-o.s)/60*HH-2);
          const w=100/o.cols, left=o.col*w, p=personById(o.ev.personId), color=p?p.color:'#7c7c7c';
          cell+='<div class="event" data-ev="'+o.ev.id+'" data-date="'+dISO+'" style="top:'+top+'px;height:'+hgt+'px;left:calc('+left+'% + 2px);width:calc('+w+'% - 6px);background:'+color+'">'
            +(o.ev.mode==='weekly'?'<span class="rep">↻</span>':'')
            +'<div class="et">'+esc(p?p.name:'—')+'</div>'
            +'<div class="eh">'+o.ev.start+'–'+o.ev.end+'</div></div>';
        });
        cell+='</div>'; cols+=cell;
      }
      return '<div class="weeknav">'
          +'<div class="weeklabel">'+range+'<span class="yr">'+mon.getFullYear()+'</span></div>'
          +'<div class="arrows">'
            +'<button class="iconbtn" id="cPrev" aria-label="settimana precedente">‹</button>'
            +'<button class="iconbtn" id="cToday" style="width:auto;padding:0 14px;font-size:13px">Oggi</button>'
            +'<button class="iconbtn" id="cNext" aria-label="settimana successiva">›</button>'
          +'</div>'
        +'</div>'
        +'<p class="diary-intro">Tocca uno spazio libero per creare un\'attività; trascina un evento per spostarlo di orario o giorno. <span class="lg-dot pres"></span> presenza · <span class="lg-dot study"></span> studio (dalle Impostazioni).</p>'
        +'<div class="cal-wrap"><div class="cal"><div class="cal-head">'+head+'</div><div class="cal-body">'+gutter+cols+'</div></div></div>';
    }
    function wireCalendar(){
      const mon=parseISO(diaryCursor);
      document.getElementById('cPrev').onclick=()=>{diaryCursor=iso(addDays(mon,-7));renderAttivita();};
      document.getElementById('cNext').onclick=()=>{diaryCursor=iso(addDays(mon,7));renderAttivita();};
      document.getElementById('cToday').onclick=()=>{diaryCursor=iso(mondayOf(new Date()));renderAttivita();};
      view.querySelectorAll('.event').forEach(el=>el.addEventListener('pointerdown',onEventPointerDown));
      view.querySelectorAll('.cal-col').forEach(col=>col.addEventListener('click',e=>{
        if(e.target.closest('.event')||window._justDragged)return;
        const rect=col.getBoundingClientRect();
        let min=H0*60+(e.clientY-rect.top)/HH*60;
        min=Math.round(min/30)*30; min=Math.max(H0*60,Math.min(H1*60-30,min));
        openEventModal({dISO:col.dataset.date,start:pad(Math.floor(min/60))+':'+pad(min%60)});
      }));
    }
    let drag=null;
    function onEventPointerDown(e){
      if(e.button!==undefined && e.button!==0)return;
      const el=e.currentTarget, id=el.dataset.ev;
      const evObj=DB.events.find(x=>x.id===id); if(!evObj)return;
      const cols=[...view.querySelectorAll('.cal-col')];
      const colW=cols.length?cols[0].getBoundingClientRect().width:120;
      drag={id,el,sx:e.clientX,sy:e.clientY,colW,moved:false,origStart:t2m(evObj.start),origEnd:t2m(evObj.end)};
      el.setPointerCapture&&el.setPointerCapture(e.pointerId);
      el.addEventListener('pointermove',onDragMove);
      el.addEventListener('pointerup',onDragUp);
      e.preventDefault();
    }
    function onDragMove(e){
      if(!drag)return;
      const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
      if(Math.abs(dx)>4||Math.abs(dy)>4)drag.moved=true;
      drag.el.style.transform='translate('+dx+'px,'+dy+'px)';
      drag.el.style.zIndex=30; drag.el.style.opacity=.85;
    }
    function onDragUp(e){
      if(!drag)return;
      const d=drag; drag=null;
      d.el.removeEventListener('pointermove',onDragMove);
      d.el.removeEventListener('pointerup',onDragUp);
      const evObj=DB.events.find(x=>x.id===d.id);
      if(!d.moved){ if(evObj)schedaEvento(evObj); return; }
      const dx=e.clientX-d.sx, dy=e.clientY-d.sy;
      const dayShift=Math.round(dx/d.colW);
      const deltaMin=Math.round((dy/HH*60)/15)*15;
      if(evObj){
        const dur=d.origEnd-d.origStart;
        let ns=Math.max(0,Math.min(24*60-dur, d.origStart+deltaMin)), ne=ns+dur;
        evObj.start=pad(Math.floor(ns/60))+':'+pad(ns%60);
        evObj.end=pad(Math.floor(ne/60))+':'+pad(ne%60);
        if(dayShift!==0)evObj.date=iso(addDays(parseISO(evObj.date),dayShift));
        repo.updateEvento(evObj.id,evObj).catch(()=>{}); scheduleNotifications();
      }
      window._justDragged=true; setTimeout(()=>window._justDragged=false,350);
      renderAttivita();
    }

    /* scheda riassuntiva di un evento: consultazione + pulsante Modifica */
    function schedaEvento(ev){
      const p=personById(ev.personId);
      const d=parseISO(ev.date);
      const dataIt=x=>{const q=parseISO(x);return pad(q.getDate())+'/'+pad(q.getMonth()+1)+'/'+String(q.getFullYear()).slice(2);};
      const riga=(l,v)=>'<div class="arow"><span>'+l+'</span><b>'+v+'</b></div>';
      const quando=ev.mode==='weekly'
        ? 'ogni '+DAYNAMES[(d.getDay()+6)%7]+(ev.until?' · fino al '+dataIt(ev.until):'')
        : DAYNAMES[(d.getDay()+6)%7]+' '+dataIt(ev.date);
      const nOpt=NOTIFY_OPTS.find(([v])=>v===(ev.notify==null?'':String(ev.notify)));
      const doc=(ev.countTeacher&&p&&p.teacherId&&personById(p.teacherId))?personById(p.teacherId).name:null;
      modalBg.innerHTML='<div class="modal"><h3><span class="dot" style="background:'+(p?p.color:'#7c7c7c')+';display:inline-block;vertical-align:1px;margin-right:8px"></span>'+esc(p?p.name:'Attività')+'</h3>'
        +'<div class="mbody">'
        +riga('Quando', quando)
        +riga('Orario', ev.start+' – '+ev.end+' <span class="muted">('+fmtHM(Math.max(0,(t2m(ev.end)??0)-(t2m(ev.start)??0)))+')</span>')
        +(nOpt&&nOpt[0]!==''?riga('Promemoria', nOpt[1]):'')
        +(doc?riga('Contata anche per', esc(doc)):'')
        +(ev.note?riga('Nota', esc(ev.note)):'')
        +'</div><div class="mfoot"><button class="btn ghost" id="evClose">Chiudi</button><span class="spacer"></span><button class="btn" id="evEdit">Modifica</button></div></div>';
      modalBg.classList.add('show');
      document.getElementById('evClose').onclick=closeModal;
      document.getElementById('evEdit').onclick=()=>openEventModal({ev});
    }
    function openEventModal(opts){
      const ev=opts.ev||null;
      const dISO=ev?ev.date:opts.dISO;
      const start=ev?ev.start:(opts.start||'09:00');
      const end=ev?ev.end:addMin(start,60);
      const pOpts=DB.people.map(p=>'<option value="'+p.id+'" '+(ev&&ev.personId===p.id?'selected':'')+'>'+esc(p.name)+' · '+p.role+'</option>').join('');
      const docenti=DB.people.filter(p=>p.role==='docente');
      const docOpts='<option value="">— nessuno —</option>'+docenti.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join('');
      const curNotify=ev?(ev.notify==null?'':String(ev.notify)):'';
      const nOpts=NOTIFY_OPTS.map(([v,l])=>'<option value="'+v+'" '+(v===curNotify?'selected':'')+'>'+l+'</option>').join('');
      modalBg.innerHTML='<div class="modal">'
        +'<h3>'+(ev?'Modifica attività':'Nuova attività')+'</h3>'
        +'<div class="mbody">'
          +'<div class="mfield"><label>Docente / alunno</label>'
            +'<select id="mPerson">'+pOpts+'<option value="__new">➕ Nuova persona…</option></select></div>'
          +'<div id="newPersonBox" style="display:none">'
            +'<div class="mrow">'
              +'<div class="mfield"><label>Nome</label><input id="npName" placeholder="Nome e cognome"></div>'
              +'<div class="mfield" style="max-width:130px"><label>Ruolo</label><select id="npRole"><option value="alunno">Alunno</option><option value="docente">Docente</option></select></div>'
            +'</div>'
            +'<div class="mfield" id="npTeacherBox" style="display:none"><label>Docente associato</label><select id="npTeacher">'+docOpts+'</select></div>'
          +'</div>'
          +'<div class="mfield" id="teacherCountBox" style="display:none">'
            +'<label class="mcheck"><input type="checkbox" id="mCountTeacher" '+(ev&&ev.countTeacher?'checked':'')+'> Conteggia l\'ora anche per il docente <b id="mTeacherName"></b></label>'
          +'</div>'
          +'<div class="mrow">'
            +'<div class="mfield"><label>Data</label><input type="date" id="mDate" value="'+dISO+'"></div>'
            +'<div class="mfield" style="max-width:110px"><label>Dalle</label><input type="time" id="mStart" value="'+start+'"></div>'
            +'<div class="mfield" style="max-width:110px"><label>Alle</label><input type="time" id="mEnd" value="'+end+'"></div>'
          +'</div>'
          +'<label class="mcheck"><input type="checkbox" id="mRepeat" '+(ev&&ev.mode==='weekly'?'checked':'')+'> Ripeti ogni settimana</label>'
          +'<div class="mfield" id="untilBox" style="display:'+(ev&&ev.mode==='weekly'?'flex':'none')+'"><label>Fino al (facoltativo)</label><input type="date" id="mUntil" value="'+(ev&&ev.until?ev.until:'')+'"></div>'
          +'<div class="mfield"><label>Avviso</label><select id="mNotify">'+nOpts+'</select></div>'
          +'<div class="mfield"><label>Note</label><textarea id="mNote" placeholder="Note…">'+(ev?esc(ev.note||''):'')+'</textarea></div>'
          +'<p class="mnote">Gli avvisi compaiono come notifica mentre l\'app è aperta.</p>'
        +'</div>'
        +'<div class="mfoot">'
          +(ev?'<button class="linkbtn del" id="mDelete">Elimina</button>':'')
          +'<div class="spacer"></div>'
          +'<button class="btn ghost" id="mCancel">Annulla</button>'
          +'<button class="btn" id="mSave">Salva</button>'
        +'</div></div>';
      modalBg.classList.add('show');
      const sel=document.getElementById('mPerson'), npBox=document.getElementById('newPersonBox');
      const npRole=document.getElementById('npRole');
      function effTeacher(){
        if(sel.value==='__new'){ if(npRole.value!=='alunno')return null; const tid=document.getElementById('npTeacher').value; return tid?personById(tid):null; }
        const p=personById(sel.value); return (p&&p.role==='alunno'&&p.teacherId)?personById(p.teacherId):null;
      }
      function sync(){
        npBox.style.display=sel.value==='__new'?'block':'none';
        document.getElementById('npTeacherBox').style.display=(sel.value==='__new'&&npRole.value==='alunno')?'flex':'none';
        const t=effTeacher(), box=document.getElementById('teacherCountBox');
        if(t){box.style.display='flex';document.getElementById('mTeacherName').textContent=t.name;}
        else box.style.display='none';
      }
      sel.onchange=sync; npRole.onchange=sync; document.getElementById('npTeacher').onchange=sync;
      if(!DB.people.length)sel.value='__new'; sync();
      const rep=document.getElementById('mRepeat');
      rep.onchange=()=>document.getElementById('untilBox').style.display=rep.checked?'flex':'none';
      document.getElementById('mNotify').onchange=e=>{if(e.target.value!==''&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission();};
      document.getElementById('mCancel').onclick=closeModal;
      if(ev)document.getElementById('mDelete').onclick=()=>deleteEvent(ev);
      document.getElementById('mSave').onclick=()=>saveEventFromModal(ev);
    }
    async function saveEventFromModal(existing){
      const sel=document.getElementById('mPerson');
      let personId=sel.value;
      const nuovaPersona = personId==='__new' ? (()=>{
        const nm=document.getElementById('npName').value.trim();
        if(!nm)return null;
        const role=document.getElementById('npRole').value;
        const p={name:nm,role,color:PALETTE[DB.people.length%PALETTE.length]};
        if(role==='alunno'){const tid=document.getElementById('npTeacher').value; if(tid)p.teacherId=tid;}
        return p;
      })() : null;
      if(personId==='__new' && !nuovaPersona){toast('Inserisci il nome della persona');return;}
      if(personId==='__new'){/* id assegnato più sotto, dopo l'insert */}
      else if(!personId){toast('Seleziona una persona');return;}
      const date=document.getElementById('mDate').value, start=document.getElementById('mStart').value, end=document.getElementById('mEnd').value;
      if(!date||!start||!end){toast('Compila data e orari');return;}
      if(t2m(end)<=t2m(start)){toast('La fine deve essere dopo l\'inizio');return;}
      const mode=document.getElementById('mRepeat').checked?'weekly':'single';
      const until=mode==='weekly'?(document.getElementById('mUntil').value||null):null;
      const nv=document.getElementById('mNotify').value, notify=nv===''?null:parseInt(nv);
      const note=document.getElementById('mNote').value;
      const ctBox=document.getElementById('teacherCountBox');
      const countTeacher = !!(ctBox && ctBox.style.display!=='none' && document.getElementById('mCountTeacher').checked);
      try{
        if(nuovaPersona){
          nuovaPersona.id=await repo.insertPersona(nuovaPersona);
          DB.people.push(nuovaPersona); personId=nuovaPersona.id;
        }
        if(existing){
          Object.assign(existing,{personId,date,start,end,mode,until,notify,note,countTeacher});
          await repo.updateEvento(existing.id,existing);
        } else {
          const nuovo={personId,date,start,end,mode,until,notify,note,countTeacher};
          nuovo.id=await repo.insertEvento(nuovo);
          DB.events.push(nuovo);
        }
      }catch(_){return;}
      closeModal(); scheduleNotifications(); renderAttivita(); toast('Attività salvata');
    }
    function deleteEvent(ev){
      if(!confirm(ev.mode==='weekly'?'Eliminare l\'intera serie settimanale?':'Eliminare questa attività?'))return;
      DB.events=DB.events.filter(e=>e.id!==ev.id);
      repo.deleteEvento(ev.id).catch(()=>{});
      closeModal(); scheduleNotifications(); renderAttivita(); toast('Attività eliminata');
    }
    function closeModal(){modalBg.classList.remove('show');modalBg.innerHTML='';}

    /* ---------- scheda persona: tutte le attività di alunno/docente ------- */
    function occorrenzePersona(id){
      const oggi=iso(new Date());
      const limite=iso(addDays(new Date(),90));
      const out=[];
      DB.events.forEach(ev=>{
        let con=null;
        if(ev.personId===id) con=null;
        else if(ev.countTeacher){
          const st=personById(ev.personId);
          if(st&&st.teacherId===id) con=st.name; else return;
        } else return;
        eventOccurrences(ev,'2000-01-01',limite).forEach(d=>{
          out.push({d, start:ev.start, end:ev.end, note:ev.note||'', con, fut:d>oggi});
        });
      });
      out.sort((a,b)=>a.d===b.d?(a.start<b.start?-1:1):(a.d<b.d?1:-1));
      return out;
    }
    function schedaPersona(id){
      const p=personById(id); if(!p)return;
      const occ=occorrenzePersona(id);
      const svolte=occ.filter(o=>!o.fut), prossime=occ.filter(o=>o.fut);
      const minDi=o=>Math.max(0,(t2m(o.end)??0)-(t2m(o.start)??0));
      const totMin=svolte.reduce((a,o)=>a+minDi(o),0);
      const dataStr=dISO=>{const d=parseISO(dISO);return DAYNAMES[(d.getDay()+6)%7].slice(0,3)+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2);};
      const righe=svolte.slice(0,80).map(o=>'<div class="arow"><span>'+dataStr(o.d)
          +' <span class="muted">'+o.start+'–'+o.end+'</span>'
          +(o.con?' <span class="chip-mini">con '+esc(o.con)+'</span>':'')
          +(o.note?' <span class="muted">· '+esc(o.note)+'</span>':'')
        +'</span><b class="mono">'+fmtHM(minDi(o))+'</b></div>').join('');
      const doc=p.role==='alunno'&&p.teacherId&&personById(p.teacherId)?personById(p.teacherId).name:null;
      modalBg.innerHTML='<div class="modal"><h3><span class="dot" style="background:'+p.color+';display:inline-block;vertical-align:1px;margin-right:8px"></span>'+esc(p.name)+'</h3>'
        +'<div class="mbody">'
        +'<p class="mnote" style="margin:0">'+(p.role==='docente'?'Docente':'Alunno')+(doc?' · docente: '+esc(doc):'')+'</p>'
        +'<div class="arow"><span>Ore svolte</span><b class="mono">'+fmtHM(totMin)+'</b></div>'
        +'<div class="arow"><span>Sessioni svolte</span><b class="mono">'+svolte.length+'</b></div>'
        +'<div class="arow"><span>Prossime in calendario</span><b class="mono">'+prossime.length+'</b></div>'
        +(righe?'<div class="subh" style="margin:10px 0 2px">Attività svolte</div><div class="sch-list">'+righe+'</div>':'<p class="hint">Ancora nessuna attività svolta.</p>')
        +'</div><div class="mfoot"><span class="spacer"></span><button class="btn" id="schClose">Chiudi</button></div></div>';
      modalBg.classList.add('show');
      document.getElementById('schClose').onclick=closeModal;
    }

    function hoursHTML(){
      if(!DB.people.length)return '<p class="hint">Nessuna persona ancora. Aggiungila dalla scheda <b>Persone</b> o creando un\'attività nel calendario.</p>';
      const today=iso(new Date());
      const acc={}; DB.people.forEach(p=>acc[p.id]={mins:0,sessions:0,fromStud:0});
      DB.events.forEach(ev=>{
        const occ=eventOccurrences(ev,'0000-01-01',today); if(!occ.length)return;
        const m=(t2m(ev.end)-t2m(ev.start))*occ.length;
        if(acc[ev.personId]){acc[ev.personId].mins+=m;acc[ev.personId].sessions+=occ.length;}
        const p=personById(ev.personId);
        if(ev.countTeacher && p && p.role==='alunno' && p.teacherId && acc[p.teacherId]){
          acc[p.teacherId].mins+=m; acc[p.teacherId].sessions+=occ.length; acc[p.teacherId].fromStud+=m;
        }
      });
      const data=DB.people.map(p=>({p,...acc[p.id]})).sort((a,b)=>b.mins-a.mins);
      const max=Math.max(1,...data.map(d=>d.mins));

              +'<div class="meta">'+d.sessions+' '+(d.sessions===1?'sessione svolta':'sessioni svolte')+(d.fromStud?' · di cui '+fmtHM(d.fromStud)+' con alunni':'')+'</div>'
            +'</div>'

      const tot=data.filter(d=>d.p.role==='alunno').reduce((a,d)=>a+d.mins,0);

    let notifyTimers=[];
    function scheduleNotifications(){
      notifyTimers.forEach(t=>clearTimeout(t)); notifyTimers=[];
      if(!('Notification'in window)||Notification.permission!=='granted')return;
      const now=Date.now(), horizon=now+24*3600*1000;
      for(let off=0;off<2;off++){
        const base=addDays(new Date(),off), dISO=iso(base);
        dayEventsFor(dISO).forEach(ev=>{
          if(ev.notify==null)return;
          const [h,m]=ev.start.split(':').map(Number);
          const when=new Date(base); when.setHours(h,m,0,0);
          const fire=when.getTime()-ev.notify*60000;
          if(fire>now&&fire<horizon){
            const p=personById(ev.personId);
            notifyTimers.push(setTimeout(()=>{try{new Notification('Attività in arrivo',{body:(p?p.name:'')+' · '+ev.start+'–'+ev.end});}catch(e){}},fire-now));
          }
        });
      }
    }

    /* scheda di un permesso: quando e quanto e' stato usato */
    function schedaPermesso(entId){
      const dataStr=dISO=>{const d=parseISO(dISO);return DAYNAMES[(d.getDay()+6)%7].slice(0,3)+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2);};
      const riga=(l,v)=>'<div class="arow"><span>'+l+'</span><b class="mono">'+v+'</b></div>';
      let titolo, righeTotali='', usi=[];
      if(entId==='__omesse'){
        titolo='Omesse timbrature';
        usi=Object.entries(DB.entries).filter(([,e])=>e&&e.act==='omessa').map(([d,e])=>({d,txt:'',note:e.note||''}));
        righeTotali=riga('Registrate nell’anno', usi.length);
      } else {
        const ent=DB.entitlements.find(x=>x.id===entId); if(!ent)return;
        titolo=ent.label;
        const u=ent.unit==='ORE';
        /* giorni in cui e' stata usata l'attivita collegata */
        const attivitaId = entId==='ferie_prec' ? 'ferie' : entId;
        let giorni=Object.entries(DB.entries)
          .filter(([,e])=>e&&e.act&&ACTBY[e.act]&&ACTBY[e.act].ent===attivitaId)
          .map(([d,e])=>({d,ph:e.ph||0,note:e.note||''}))
          .sort((a,b)=>a.d<b.d?-1:1);
        let used=ent.used0+usage(ent.id), res=ent.total-used, fruitiApp;
        if(entId==='ferie'||entId==='ferie_prec'){
          /* le ferie scalano prima l'anno precedente: si ripartiscono i giorni */
          const alloc=ferieAlloc();
          if(entId==='ferie_prec'){ giorni=giorni.slice(0,alloc.fromPrev); used=alloc.prevUsed; res=alloc.prevRes; fruitiApp=alloc.fromPrev+' gg'; }
          else { giorni=giorni.slice(ferieAlloc().fromPrev); used=alloc.curUsed; res=alloc.curRes; fruitiApp=alloc.fromCur+' gg'; }
        } else {
          fruitiApp=u?fmtHM(Math.round(usage(ent.id)*60)):usage(ent.id)+' gg';
        }
        const f=v=>u?(Number.isInteger(v)?v:v.toFixed(2)):v;
        righeTotali=riga('Diritto annuo', f(ent.total)+(u?' ore':' gg'))
          +(ent.used0?riga('Fruito prima dell’app', f(ent.used0)+(u?' ore':' gg')):'')
          +riga('Fruito nell’app', fruitiApp)
          +riga('Residuo', f(res)+(u?' ore':' gg'));
        usi=giorni.reverse().map(g=>({d:g.d, txt:u?fmtHM(g.ph):'1 gg', note:g.note}));
      }
      const lista=usi.map(o=>'<div class="arow"><span>'+dataStr(o.d)
          +(o.note?' <span class="muted">· '+esc(o.note)+'</span>':'')
        +'</span><b class="mono">'+o.txt+'</b></div>').join('');
      modalBg.innerHTML='<div class="modal"><h3>'+esc(titolo)+'</h3><div class="mbody">'
        +righeTotali
        +(lista?'<div class="subh" style="margin:10px 0 2px">Quando</div><div class="sch-list">'+lista+'</div>'
               :'<p class="hint" style="margin:8px 0 0">Ancora nessun utilizzo registrato nelle Timbrature.</p>')
        +'</div><div class="mfoot"><span class="spacer"></span><button class="btn" id="permClose">Chiudi</button></div></div>';
      modalBg.classList.add('show');
      document.getElementById('permClose').onclick=closeModal;
    }

      const wks=weeksWithData();
      const riepilogo={
        saldoFinaleMin:bal,

      /* nuovo anno */

      DB.initialBalanceMin=bal;

      const prev=DB.entitlements.find(e=>e.id==='ferie_prec');

    /* ---------- Tema chiaro/scuro (modello Controtempo, brief §3) ----------
       Tre stati: scelta esplicita salvata (data-theme sull'elemento radice)
       oppure nessuna scelta = si segue il sistema. */
    function temaScuroAttivo(){
      const t=document.documentElement.getAttribute('data-theme');
      if(t==='dark')return true;
      if(t==='light')return false;
      return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
    }
    function applyTheme(t){
      if(t==='dark'||t==='light'){
        document.documentElement.setAttribute('data-theme',t);
        try{localStorage.setItem('ctm:tema',t);}catch(e){}
      }
      const scuro=temaScuroAttivo();
      const m=document.querySelector('meta[name="theme-color"]');
      if(m)m.setAttribute('content',scuro?'#0B0E0F':'#F6F3ED');
    }
    self._applyTheme=applyTheme;
    applyTheme();
    const temaBtn=document.getElementById('temaToggle');
    if(temaBtn)temaBtn.onclick=()=>applyTheme(temaScuroAttivo()?'light':'dark');

    /* ---------- Font switch ---------- */
    function applyFont(f){
      const ok=['system','rounded','modern','product'];
      if(ok.indexOf(f)<0)f='system';
      const root=document.getElementById('appRoot');
      if(root)root.setAttribute('data-font',f);
      document.querySelectorAll('.font-switch button').forEach(b=>b.classList.toggle('active',b.dataset.font===f));
      try{if(typeof localStorage!=='undefined')localStorage.setItem('consba:font',f);}catch(e){}
    }
    self._applyFont=applyFont;
    let initFont='system';
    try{ initFont=(self.props&&self.props.fontset)||(typeof localStorage!=='undefined'&&localStorage.getItem('consba:font'))||'system'; }catch(e){}
    applyFont(initFont);
    document.querySelectorAll('.font-switch button').forEach(b=>b.onclick=()=>applyFont(b.dataset.font));

    async function avviaApp(){
      gate.style.display='none';
      repo.setOnError((ctx,err)=>{
        console.error('[repo]',ctx,err);
        try{toast('⚠️ Salvataggio non riuscito: controlla la connessione');}catch(_){}
      });
      /* al risveglio della PWA il token puo' essere in rinnovo e la rete
         ancora fredda: si riprova da soli prima di disturbare l'utente */
      let dati=null;
      for(let tentativo=1;tentativo<=3;tentativo++){
        try{ await sessione(); dati=await repo.loadAll(); break; }
        catch(_){ if(tentativo<3) await new Promise(r=>setTimeout(r,800*tentativo)); }
      }
      if(!dati){
        gate.style.display='';
        agBox.innerHTML='<p class="sub" style="text-align:center;margin:0 0 6px">Non riesco a leggere i dati. Controlla la connessione e riprova.</p>'
          +'<button class="btn btn-primary" id="agRetry">Riprova</button>';
        document.getElementById('agRetry').onclick=()=>{agZitto();avviaApp();};
        return;
      }
      DB=dati;
      /* primo accesso: semina i diritti/limiti di default del prototipo */
      if(!DB.entitlements.length){
        DB.entitlements=seedData().entitlements;
        repo.saveDiritti(DB.entitlements);
      }
      if(!DB.entitlements.some(e=>e.id==='ferie_prec')){
        const i=DB.entitlements.findIndex(e=>e.id==='ferie');
        DB.entitlements.splice(i<0?0:i+1,0,{id:'ferie_prec',label:'Ferie anno precedente',unit:'GG',total:0,used0:0});
        repo.saveDiritti(DB.entitlements);
      }
      const bl=document.getElementById('btnLogout');
      if(bl)bl.onclick=async()=>{
        try{ await repo.flush(); }catch(_){}
        await logout(); location.reload();
      };
      modalBg.onclick=e=>{if(e.target===modalBg)closeModal();};
      initKeypad();
      document.addEventListener('click',e=>{
        const k=document.getElementById('keypad');
        if(!k||!k.classList.contains('show'))return;
        if(e.target.closest('#keypad')||e.target.classList.contains('tinput'))return;
        closeKeypad();
      });
      scheduleNotifications();
      setView('riepilogo');
    }

    (async function init(){
      const s=await sessione();
      if(s)avviaApp(); else mostraLogin();
    })();
})();
</script>
</body>
</html>
