<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F6F3ED">
<title>Registro presenze · Conservatorio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone/icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Registro">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html,body{margin:0;background:#F2F2F7}

  #appRoot{
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    --shadow:0 1px 3px rgba(0,0,0,.06);
    --shadow-lg:0 2px 6px rgba(20,20,30,.06),0 26px 64px -22px rgba(20,20,30,.32);
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.45;min-height:100vh;
  }
  #appRoot{--bar:rgba(249,249,251,.82)}
  #appRoot svg{stroke-width:2}


  #appRoot[data-theme="dark"]{
    --paper:#000000; --surface:#1C1C1E; --panel:#2C2C2E; --rest:#1C1C1E;
    --line:rgba(84,84,88,.5); --line-strong:rgba(84,84,88,.65);
    --ink:#FFFFFF; --ink-soft:rgba(235,235,245,.62); --muted:rgba(235,235,245,.42);
    --side-bg:rgba(28,28,30,.86); --bar:rgba(20,20,22,.8);
    --accent:#409CFF; --accent2:#5aa8ff; --accent-soft:rgba(64,156,255,.2);
    --grad:linear-gradient(135deg,var(--accent),var(--accent2));
    --pos:#30D158; --pos-soft:rgba(48,209,88,.2);
    --neg:#FF9F0A; --neg-soft:rgba(255,159,10,.2);
  }
  #appRoot[data-theme="light"]{
    --paper:#F2F2F7; --surface:#FFFFFF; --panel:#EAEAEF; --rest:#F2F2F7;
    --line:rgba(60,60,67,.13); --line-strong:rgba(60,60,67,.24);
    --ink:#000000; --ink-soft:rgba(60,60,67,.62); --muted:rgba(60,60,67,.45);
    --side-bg:rgba(249,249,251,.86); --bar:rgba(249,249,251,.82);
    --accent:#0B6CD9; --accent2:#3f93e6; --accent-soft:rgba(11,108,217,.12);
    --grad:linear-gradient(135deg,var(--accent),var(--accent2));
    --pos:#1E8E3E; --pos-soft:rgba(30,142,62,.14);
    --neg:#C2560A; --neg-soft:rgba(194,86,10,.14);
  }

  button{font-family:inherit;cursor:pointer}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .app{display:flex;min-height:100vh}

  /* ---- Sidebar ---- */
  .side{width:264px;flex:none;background:var(--side-bg);color:var(--ink-soft);padding:30px 20px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
  .brand{display:flex;flex-direction:column;gap:2px;margin-bottom:30px;padding:0 8px}
  .brand .mark{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
  .brand .sub{font-size:12px;color:var(--muted);letter-spacing:.2px}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:var(--ink-soft);padding:11px 14px;border-radius:10px;font-size:14.5px;font-weight:500;transition:.15s}
  .nav button .ic{width:19px;height:19px;flex:none;opacity:.72}
  .nav button:hover{background:rgba(0,0,0,.045);color:var(--ink)}
  .nav button.active{background:var(--accent-soft);color:var(--accent)}
  .nav button.active .ic{opacity:1}
  .side-foot{margin-top:auto;padding:0 8px;font-size:11.5px;color:var(--muted);line-height:1.5}
  .side-foot b{color:var(--ink)}

  /* ---- Main ---- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 40px;border-bottom:.5px solid var(--line);background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:20}
  .topbar h1{font-weight:700;font-size:26px;margin:0;letter-spacing:-.5px}
  .topbar .crumb{font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.6px;text-transform:uppercase}
  .topbar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
  .theme-switch{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .theme-switch button{border:0;background:none;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
  .theme-switch button .sw{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .theme-switch button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .balance-chip{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 18px}
  .balance-chip .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .balance-chip .val{font-size:18px;font-weight:700}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .content{padding:36px 40px 90px;max-width:1040px}

  /* ---- Cards / generic ---- */
  .card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
  .sec-h{font-size:19px;font-weight:700;margin:0 0 3px;letter-spacing:-.3px}
  .sec-d{font-size:13px;color:var(--muted);margin:0 0 18px}

  /* ---- Hero ---- */
  .hero{padding:36px 36px 30px;margin-bottom:24px;display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start}
  .hero .big{flex:1;min-width:240px}
  .hero .eyebrow{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .hero .figure{font-variant-numeric:tabular-nums;font-size:56px;font-weight:700;line-height:1;letter-spacing:-2px}
  .hero .note{font-size:13.5px;color:var(--ink-soft);margin-top:12px;max-width:340px}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:290px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px}
  .stat .n{font-family:var(--mono);font-size:24px;font-weight:800;line-height:1}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:7px;letter-spacing:.2px}
  .stat:nth-child(6n+1){background:#fdeee6;border-color:#f8ddcd}
  .stat:nth-child(6n+2){background:#e3f3ec;border-color:#cfeadd}
  .stat:nth-child(6n+3){background:#ece8fa;border-color:#ddd5f2}
  .stat:nth-child(6n+4){background:#e4f0fb;border-color:#d0e3f6}
  .stat:nth-child(6n+5){background:#fdf2d8;border-color:#f5e5be}
  .stat:nth-child(6n+6){background:#fce7ee;border-color:#f4d0de}

  .bars{padding:26px 30px;margin-bottom:24px}
  .bars-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
  .barrow{display:grid;grid-template-columns:128px 1fr 92px;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--line)}
  .barrow:first-of-type{border-top:0}
  .barrow .wk{font-size:12.5px;color:var(--ink-soft)}
  .barrow .track{position:relative;height:12px;background:var(--panel);border-radius:999px;overflow:hidden}
  .barrow .fill{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:999px}
  .barrow .fill.over{background:var(--pos)}
  .barrow .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--line-strong)}
  .barrow .res{font-family:var(--mono);font-size:13px;text-align:right;font-weight:500}

  /* ---- Week navigator ---- */
  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
  .weeknav .arrows{display:flex;gap:8px}
  .iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);font-size:17px}
  .iconbtn:hover{background:var(--panel)}
  .weeklabel{font-size:20px;font-weight:700;letter-spacing:-.3px}
  .weeklabel .yr{color:var(--muted);font-weight:400;font-size:14px;margin-left:8px}
  .wk-summary{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .wk-summary .blk{display:flex;flex-direction:column}
  .wk-summary .blk .l{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .wk-summary .blk .v{font-family:var(--mono);font-size:17px;font-weight:700}
  .wk-summary .esito{margin-left:auto;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px}
  .auth-bar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--neg-soft);border:1px solid color-mix(in srgb,var(--neg) 20%,transparent);border-radius:11px;padding:12px 18px;margin:0 0 16px;font-size:13.5px;color:var(--ink-soft)}
  .auth-bar.done{background:var(--pos-soft);border-color:color-mix(in srgb,var(--pos) 20%,transparent)}
  .auth-bar .ab-sp{flex:1}
  .auth-bar .ab-txt b{color:var(--ink)}
  .auth-bar .ab-u{font-weight:600;margin-left:-4px}
  .auth-bar .btn{padding:8px 15px;font-size:13px}
  .auth-num{width:68px;font-family:var(--mono);font-size:15px;font-weight:600;text-align:center;border:1px solid var(--line-strong);border-radius:12px;padding:7px}
  .wk-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 16px;font-size:13px}
  .wk-actions .wa-lab{color:var(--muted);margin-right:4px}
  .study-in{background:var(--pos-soft)}
  .esito.ok{background:var(--panel);color:var(--ink-soft)}
  .esito.over{background:var(--pos-soft);color:var(--pos)}
  .esito.under{background:var(--neg-soft);color:var(--neg)}

  .day{display:grid;grid-template-columns:100px 1fr;border-top:1px solid var(--line);border-left:4px solid var(--dac,transparent)}
  .daylist .day:first-child{border-top:0}
  .day.rest{background:var(--rest)}
  .day .dcol{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);justify-content:center}
  .day .dname{font-size:13px;font-weight:600;text-transform:capitalize}
  .day .ddate{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .day.today{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
  .day.today.rest{background:color-mix(in srgb,var(--accent-soft) 45%,var(--rest))}
  .today-pill{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#fff;background:var(--grad);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  .tdur{font-family:var(--mono);font-size:11.5px;color:var(--muted);align-self:center;margin-left:2px}
  .study-chip{align-self:center;font-size:12px;color:var(--pos);background:var(--pos-soft);border:1px solid color-mix(in srgb,var(--pos) 25%,transparent);border-radius:10px;padding:5px 10px;white-space:nowrap}
  .study-chip b{font-family:var(--mono);font-weight:700}
  .wk-progress{flex-basis:100%;margin-top:4px}
  .wp-track{position:relative;height:7px;background:var(--panel);border-radius:999px;overflow:hidden}
  .wp-fill{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:999px}
  .wp-fill.over{background:var(--pos)}
  .wp-goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--line-strong)}
  .wjump{position:relative;overflow:hidden}
  .wjump input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
  .day .body{padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
  .day .total{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:15px;text-align:right;min-width:70px}
  .day .total small{display:block;font-weight:400;font-size:10px;color:var(--muted);letter-spacing:.3px}
  .dayremove{font-size:12px;padding:4px 6px;order:99;margin-left:6px}
  .autobreak{flex-basis:100%;text-align:right;font-size:11.5px;color:var(--neg);font-weight:500;margin-top:-4px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
  select,input[type=time],input[type=number],input[type=text],input[type=date]{font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 12px}
  select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .day select{min-width:150px}
  .day input[type=time]{width:104px}
  .tinput{width:64px;text-align:center;font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:.5px;cursor:pointer;caret-color:transparent}
  .tinput::placeholder{letter-spacing:1px;color:#c2bdad}
  .tinput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .tsep{color:var(--muted);font-size:13px;align-self:center}

  /* tastierino orario */
  .kp{position:fixed;left:0;right:0;bottom:0;z-index:70;transform:translateY(115%);transition:transform .22s ease;pointer-events:none}
  .kp.show{transform:translateY(0);pointer-events:auto}
  .kp-sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:10px 24px 0 0;box-shadow:0 -14px 44px -18px rgba(20,26,48,.4);padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto}
  .kp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .kp-label{font-size:12px;color:var(--muted)}
  .kp-label b{display:block;color:var(--ink);font-size:13.5px;font-weight:600;text-transform:capitalize;margin-top:2px}
  .kp-display{font-size:32px;font-weight:700;letter-spacing:2px}
  .kp-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:9px}
  .kp-tool{padding:11px 0;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
  .kp-tool:active{background:var(--line)}
  .kp-tool.kp-now{background:var(--pos-soft);color:var(--pos);border-color:transparent}
  .kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .kp-grid button{font-family:var(--mono);font-size:21px;font-weight:600;padding:17px 0;border:1px solid var(--line);background:var(--surface);border-radius:11px;color:var(--ink)}
  .kp-grid button:active{background:var(--panel);transform:scale(.97)}
  .kp-grid .kp-act{font-family:var(--sans);font-size:16px;color:var(--ink-soft)}
  .kp-done{width:100%;margin-top:10px;padding:15px 0;border:0;background:var(--accent);color:#fff;border-radius:11px;font-size:15px;font-weight:600}
  .kp-done:active{filter:brightness(.93)}
  .content.kp-open{padding-bottom:340px}
  .day input.note{flex:1;min-width:130px}
  .times{display:flex;gap:10px;flex-wrap:wrap}
  .rest-tag{font-size:12.5px;color:var(--muted);font-style:italic}

  /* ---- Permessi ---- */
  .perm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .perm{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px 18px;box-shadow:var(--shadow)}
  .perm .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:11px}
  .perm .name{font-weight:600;font-size:14.5px}
  .perm .unit{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .perm .track{height:9px;background:var(--panel);border-radius:999px;overflow:hidden}
  .perm .fill{height:100%;background:var(--ink);border-radius:999px}
  .perm .fill.full{background:var(--neg)}
  .perm .nums{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px}
  .perm .nums .r{font-weight:600}
  .perm .nums .mono{font-family:var(--mono)}
  .perm-note{margin-top:7px;font-size:11px;color:var(--pos);font-weight:600;text-transform:uppercase;letter-spacing:.3px}

  /* ---- Impostazioni ---- */
  .setrow{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin-bottom:22px}
  .sched{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:6px 0 4px}
  .sched .d{display:flex;flex-direction:column;gap:5px}
  .sched .d span{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);text-align:center}
  .sched .d input{text-align:center;padding:8px 4px}
  .schhead{display:grid;grid-template-columns:44px 78px 1fr 74px;gap:10px;align-items:center;padding:0 2px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
  .schhead span:nth-child(3){padding-left:2px}
  .schlist{display:flex;flex-direction:column}
  .schrow{display:grid;grid-template-columns:44px 78px 1fr 74px;gap:10px;align-items:center;padding:7px 2px;border-top:1px solid var(--line)}
  .schrow:first-child{border-top:0}
  .schd{font-size:13px;font-weight:600;text-transform:capitalize}
  .schog{display:flex;align-items:center;gap:5px}
  .schpz{display:flex;align-items:center;gap:4px}
  .schpzin{width:52px;text-align:center;font-family:var(--mono)}
  .schfg{display:flex;align-items:center;gap:6px}
  .schoro{display:inline-block;min-width:56px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 6px}
  .schu{font-size:12px;color:var(--muted)}
  .scht{flex:1;min-width:0;padding:7px 8px;font-family:var(--mono);font-size:13px}
  .scharr{color:var(--muted);font-size:12px}
  .saldo-edit{display:flex;align-items:center;gap:7px}
  .saldo-edit select{padding:9px 8px}
  .period{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:12px;background:var(--panel)}
  .period-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .period-head .field{gap:4px}
  .period-sum{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink)}
  .period-base{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .period .schhead,.period .schrow{grid-template-columns:44px 78px 1fr 74px}
  .addperiod{font-size:13.5px;padding:9px 16px;margin-top:2px}
  .ent-table{width:100%;border-collapse:collapse;margin-top:8px}
  .ent-table th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
  .ent-table td{padding:5px 8px;border-bottom:1px solid var(--line);font-size:13.5px}
  .ent-table input{width:74px;padding:6px 8px}
  .ent-table select{padding:6px 8px;font-size:13px}
  .ent-table td:first-child{font-weight:500}
  .btn{border:0;background:var(--grad);color:#fff;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600}
  .btn:hover{filter:brightness(1.04)}
  .btn.ghost{background:var(--panel);color:var(--ink)}
  .btn.ghost:hover{background:var(--line);filter:none}
  .btn.danger{border:1px solid var(--neg);color:var(--neg);background:transparent}
  .btn.danger:hover{background:var(--neg-soft);filter:none}
  .btn.warn{border:1px solid #c99a3a;color:#9a6a12;background:transparent}
  .btn.warn:hover{background:#f7edd6;filter:none}
  .hint{font-size:12.5px;color:var(--muted);margin-top:5px}
  .divider{height:1px;background:var(--line);margin:28px 0}
  .share-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .qr-box{width:180px;height:180px;flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center}
  .qr-box svg{width:100%;height:100%;display:block}
  .share-side{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .share-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .share-url{font-family:var(--mono);font-size:12.5px;word-break:break-all;background:var(--panel);border-radius:9px;padding:9px 11px;width:100%}
  .ok-chip{font-size:13px;font-weight:600;color:var(--pos);background:var(--pos-soft);border-radius:12px;padding:7px 14px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- Timbratura ---- */
  .punch{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:22px 28px;margin-bottom:24px;background:linear-gradient(180deg,var(--surface),var(--panel))}
  .punch-date{font-size:12.5px;color:var(--muted);text-transform:capitalize;letter-spacing:.3px}
  .punch-clock{font-size:46px;font-weight:800;line-height:1;letter-spacing:-1.5px;margin-top:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .punch-today{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
  .punch-btn{font-size:16px;font-weight:600;padding:16px 28px;border-radius:999px;display:inline-flex;align-items:center;gap:11px}
  .punch-btn svg{width:19px;height:19px}
  .punch-btn:disabled{cursor:default;background:var(--panel);color:var(--muted);border:1px solid var(--line);filter:none}

  /* ---- Registro attività (calendario) ---- */
  .diary-intro{font-size:13px;color:var(--muted);margin:0 0 16px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;gap:2px;margin-bottom:18px}
  .seg button{border:0;background:none;padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  .cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
  .cal{min-width:660px;position:relative}
  .cal-head{display:grid;grid-template-columns:54px repeat(6,1fr);position:sticky;top:0;background:var(--surface);z-index:5;border-bottom:1px solid var(--line)}
  .cal-head .ch{padding:9px 4px;text-align:center;border-left:1px solid var(--line)}
  .cal-head .ch:first-child{border-left:0}
  .cal-head .dn{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .cal-head .dd{font-family:var(--mono);font-size:16px;font-weight:700;margin-top:2px}
  .cal-head .ch.today .dd{color:var(--accent)}
  .cal-body{display:grid;grid-template-columns:54px repeat(6,1fr)}
  .cal-gutter .hr{height:46px;position:relative}
  .cal-gutter .hr span{position:absolute;top:-7px;right:7px;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .cal-col{position:relative;border-left:1px solid var(--line)}
  .cal-col.today{background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface))}
  .cal-col .hr{height:46px;border-top:1px solid var(--line)}
  .cal-col .hr:first-child{border-top:0}
  .cal-band{position:absolute;left:0;right:0;pointer-events:none;z-index:1}
  .cal-band.pres{background:rgba(47,111,94,.13);border-top:2px solid rgba(47,111,94,.4);border-bottom:2px solid rgba(47,111,94,.4)}
  .cal-band.study{background:rgba(212,170,40,.20);border-top:2px solid rgba(190,140,20,.5);border-bottom:2px solid rgba(190,140,20,.5)}
  .lg-dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin:0 2px 0 6px}
  .lg-dot.pres{background:rgba(47,111,94,.35)}
  .lg-dot.study{background:rgba(212,170,40,.5)}
  .event{position:absolute;border-radius:9px;padding:3px 7px;overflow:hidden;cursor:grab;color:#fff;box-shadow:0 1px 3px rgba(20,26,48,.18);z-index:3;touch-action:none;user-select:none}
  .event.dragging,.event:active{cursor:grabbing}
  .event .et{font-weight:600;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .event .eh{font-family:var(--mono);font-size:9.5px;opacity:.92}
  .event .rep{position:absolute;top:2px;right:4px;font-size:10px;opacity:.9}

  /* modale */
  .modal-bg{position:fixed;inset:0;background:rgba(20,26,48,.42);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);border-radius:10px;width:100%;max-width:450px;box-shadow:var(--shadow-lg);max-height:92vh;overflow:auto}
  .modal h3{font-size:20px;font-weight:700;margin:0;padding:20px 22px 0;letter-spacing:-.3px}
  .modal .mbody{padding:15px 22px 4px;display:flex;flex-direction:column;gap:13px}
  .mfield{display:flex;flex-direction:column;gap:5px}
  .mfield label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .mfield input,.mfield select,.mfield textarea{font-family:inherit;font-size:14px;border:1px solid var(--line-strong);border-radius:12px;padding:9px 11px;color:var(--ink);background:var(--surface);width:100%}
  .mfield textarea{resize:vertical;min-height:54px;line-height:1.5}
  .mfield input:focus,.mfield select:focus,.mfield textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .mrow{display:flex;gap:12px}.mrow .mfield{flex:1}
  .mcheck{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500}
  .mcheck input{width:17px;height:17px}
  .mnote{font-size:11.5px;color:var(--muted);margin:2px 0 0}
  .mfoot{display:flex;gap:10px;align-items:center;padding:14px 22px 20px}
  .mfoot .spacer{flex:1}

  /* persone & ore */
  .ppl-add{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px}
  .ppl{display:flex;flex-direction:column;gap:8px}
  .ppl-item{display:flex;align-items:center;gap:12px;padding:12px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .ppl-item .nm{font-weight:600;font-size:14px}
  .ppl-item .rl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .ppl-item .sp{flex:1}
  .linkbtn{background:none;border:0;color:var(--ink-soft);font-size:13px;font-weight:600;padding:6px 9px;border-radius:9px}
  .linkbtn:hover{background:var(--panel)}
  .linkbtn.del{color:var(--neg)}
  .subh{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:24px 0 6px}
  .hours-row{display:grid;grid-template-columns:1fr 96px;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)}
  .hours-row:first-of-type{border-top:0}
  .who{display:flex;align-items:center;gap:11px;font-size:14.5px}
  .who-sub{font-size:11.5px;color:var(--muted);font-weight:400}
  .ppl-teacher{font-size:13px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);max-width:150px}
  .hbar{height:8px;background:var(--panel);border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .hbar i{display:block;height:100%;border-radius:999px}
  .hours-row .meta{font-size:11.5px;color:var(--muted)}
  .hours-row .htot{font-family:var(--mono);font-weight:700;font-size:16px;text-align:right}

  /* ---- Mobile ---- */
  .mobnav{display:none}
  @media(max-width:820px){
    .app{flex-direction:column}
    .side{display:none}
    .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;top:auto;z-index:40;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0}
    .mobnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);padding:6px 2px;border-radius:12px;font-size:9.5px;font-weight:600;min-height:50px;letter-spacing:-.1px}
    .mobnav button svg{width:21px;height:21px}
    .mobnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mobnav button.active{color:var(--accent)}
    .topbar{padding:15px 18px;flex-wrap:wrap}
    .topbar h1{font-size:20px}
    .topbar-right{gap:10px}
    .theme-switch button{padding:7px 11px;font-size:12px}
    .content{padding:20px 16px 104px}
    .hero{padding:24px 20px}
    .stat-grid{grid-template-columns:repeat(3,1fr);min-width:0;width:100%}
    .perm-grid{grid-template-columns:1fr}
    .barrow{grid-template-columns:74px 1fr 72px;gap:8px}
    .sched{grid-template-columns:repeat(4,1fr)}
    .iconbtn{width:44px;height:44px}
    select,input[type=time],input[type=number],input[type=text],input[type=date]{font-size:16px;padding:11px 12px}
    .btn{padding:13px 20px}
    .linkbtn{padding:9px 11px}
    .seg button{padding:11px 16px}
    .card.daylist{background:transparent;border:0;box-shadow:none;border-radius:0}
    .daylist .day{display:block;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden}
    .daylist .day.rest{background:var(--rest)}
    .day .dcol{flex-direction:row;align-items:baseline;gap:8px;border-right:0;border-bottom:1px solid var(--line);padding:12px 15px}
    .day .dcol .dname{font-size:15px}
    .day .dcol .ddate{margin-left:auto;font-size:13px}
    .day .body{padding:14px 15px;flex-direction:column;align-items:stretch;gap:14px}
    .day .field{width:100%}
    .day select{width:100%;min-width:0;min-height:46px}
    .day .times{gap:10px}
    .tinput{flex:1;width:auto;min-height:48px;font-size:18px}
    .day .note{width:100%;min-height:46px}
    .day .total{margin-left:0;text-align:left;display:flex;align-items:baseline;gap:8px;font-size:18px;padding-top:2px;border-top:1px solid var(--line)}
    .day .total small{display:inline;margin-left:0}
    .dayremove{flex-basis:auto;text-align:center;border:1px solid var(--line);border-radius:12px;padding:11px}
    .auth-bar,.wk-actions{margin-top:0}
    .wk-actions{gap:8px}
    .wk-actions .linkbtn{border:1px solid var(--line);border-radius:10px}
    .cal{min-width:600px}
    .toast{bottom:96px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  /* ============ PORT iOS (guscio Claude Design) — vista Timbrature ============ */
  #appRoot{
    --tint:var(--accent); --tint-weak:var(--accent-soft); --on-tint:#fff;
    --pos-weak:var(--pos-soft); --neg-weak:var(--neg-soft);
    --card:var(--surface); --card-2:var(--panel); --bg:var(--paper);
    --sep:var(--line); --fill:var(--panel); --fill-2:var(--line-strong);
    --ink-2:var(--ink-soft); --ink-3:var(--muted); --f:var(--sans); --f-num:var(--mono);
    --r-card:12px; --r-ctl:10px; --hit:44px; --gutter:16px;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:28px;--s7:40px;
    --t-caption2:11px;--t-caption:12px;--t-footnote:13px;--t-sub:15px;--t-body:17px;--t-title3:20px;--t-title2:22px;--t-title1:28px;--t-large:34px;--t-hero:56px;
  }
  .content.bare{padding:0;max-width:none}
  .content.bare.kp-open{padding:0 0 360px}
  .ios{padding:8px 0 calc(96px + env(safe-area-inset-bottom));font-size:var(--t-body);line-height:1.35;letter-spacing:-.01em}
  .ios .num,.ios .mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .ios .muted{color:var(--ink-2)} .ios .pos{color:var(--pos)} .ios .neg{color:var(--neg)}
  .ios .hero-title{padding:8px var(--gutter) 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .ios .large-title{font-size:var(--t-large);font-weight:700;line-height:1.1;letter-spacing:-.028em;margin:0}
  .ios .hero-title p{color:var(--ink-2);font-size:var(--t-sub);margin:2px 0 0}
  .ios .stack{display:flex;flex-direction:column;gap:20px;padding:8px 0 20px}
  .ios .card{background:var(--card);border-radius:var(--r-card);margin:0 var(--gutter);padding:16px;box-shadow:none;border:0}
  .ios .foot{font-size:var(--t-footnote)} .ios .sub{font-size:var(--t-sub)}
  .ios .badge{display:inline-flex;align-items:center;font-size:var(--t-caption);font-weight:600;background:transparent;color:var(--ink-2);white-space:nowrap;padding:0}
  .ios .badge--pos{color:var(--pos)}
  .ios .badge--neg{color:var(--neg)}
  .ios .badge--tint{color:var(--tint)}
  .ios .badge--today{color:var(--tint)}
  .ios .meter{position:relative;height:8px;background:var(--fill);border-radius:999px;display:block}
  .ios .meter__fill{position:absolute;inset:0 auto 0 0;background:var(--tint);border-radius:999px}
  .ios .meter__fill--pos{background:var(--pos)} .ios .meter__fill--neg{background:var(--neg)}
  .ios .meter__goal{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--ink);opacity:.55}
  .ios .navbtn{min-height:var(--hit);min-width:var(--hit);border-radius:999px;background:var(--fill);color:var(--ink);font-size:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
  .ios .navbtn:active{opacity:.5}
  .ios .wjump2{position:relative;overflow:hidden}
  .ios .wjump2 input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
  .ios .daylist{display:flex;flex-direction:column;gap:12px}
  .ios .day{background:var(--card);border-radius:var(--r-card);margin:0 var(--gutter);overflow:hidden}
  .ios .day--oggi{box-shadow:0 0 0 2px var(--tint)}
  .ios .day__head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;border-bottom:.5px solid var(--sep)}
  .ios .day__hl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .ios .day__kindline{width:3px;height:20px;border-radius:2px;background:var(--dac,var(--tint))}
  .ios .day__name{font-size:var(--t-body);font-weight:600;text-transform:capitalize}
  .ios .day__date{font-size:var(--t-sub);color:var(--ink-2);font-family:var(--f-num)}
  .ios .act-sel{border:0;background:var(--tint-weak);color:var(--tint);font-weight:600;font-size:var(--t-caption);border-radius:999px;padding:6px 10px;min-height:34px;max-width:150px;-webkit-appearance:none;appearance:none;text-align:center}
  .ios .day__body{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
  .ios .punch{display:flex;align-items:center;gap:8px}
  .ios .input--time{background:var(--fill);border:0;border-radius:var(--r-ctl);min-height:var(--hit);min-width:88px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;font-size:var(--t-body);text-align:center;color:var(--ink)}
  .ios .input--time.is-empty{color:var(--ink-3)}
  .ios .input--time.is-active{box-shadow:inset 0 0 0 2px var(--tint);color:var(--tint)}
  .ios .punch__arrow{color:var(--ink-3)}
  .ios .punch__dur{margin-left:auto;font-size:var(--t-footnote);color:var(--ink-2);font-family:var(--f-num)}
  .ios .note{width:100%;background:var(--fill);border:0;border-radius:var(--r-ctl);min-height:40px;padding:10px 12px;font-size:var(--t-sub);color:var(--ink)}
  .ios .note::placeholder{color:var(--ink-3)}
  .ios .day__foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:.5px solid var(--sep)}
  .ios .day__total{font-size:var(--t-title3);font-weight:600;font-family:var(--f-num);font-variant-numeric:tabular-nums}
  .ios .day__total small{display:block;font-size:var(--t-caption2);color:var(--ink-2);font-weight:400;font-family:var(--f);text-align:right}
  .ios .day__note{font-size:var(--t-caption);color:var(--neg);text-align:right}
  .ios .phfield{display:flex;align-items:center;gap:8px;font-size:var(--t-sub)}
  .ios .phield input{width:90px}
  .ios .day--riposo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 16px;background:transparent;box-shadow:inset 0 0 0 .5px var(--sep)}
  .ios .day__leaverow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ios .linkrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:var(--t-sub)}
  .ios .ilink{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:7px 15px;border-radius:999px;background:var(--tint-weak);color:var(--tint);font-weight:600;font-size:14px}
  .ios .idanger{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:7px 15px;border-radius:999px;background:var(--neg-weak);color:var(--neg);font-weight:600;font-size:14px}
  .ios .ilink:active,.ios .idanger:active,.ios .ios-btn:active{opacity:.55}
  .ios .authbox{background:var(--card);border-radius:var(--r-card);margin:0 var(--gutter);padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--t-sub)}
  .ios .authbox input{width:60px;background:var(--fill);border:0;border-radius:8px;min-height:38px;text-align:center;font-family:var(--f-num)}
  .ios .ios-btn{min-height:40px;padding:9px 16px;border-radius:999px;background:var(--tint);color:#fff;font-weight:600;font-size:var(--t-sub)}
  .ios .esito-badge{align-self:center}
  .ios .group-header{font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;margin:0 var(--gutter) 8px}
  .ios .group{background:var(--card);border-radius:var(--r-card);margin:0 var(--gutter);overflow:hidden}
  .ios .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:11px 16px;border-top:.5px solid var(--sep)}
  .ios .row:first-child{border-top:0}
  .ios .row__label{font-size:var(--t-body)}
  .ios .row__value{font-size:var(--t-body);color:var(--ink-2);font-family:var(--f-num);font-variant-numeric:tabular-nums}
  .ios .weekrow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;min-height:44px;padding:9px 16px;border-top:.5px solid var(--sep)}
  .ios .weekrow:first-child{border-top:0}
  .ios .weekrow__k{font-size:13px;color:var(--ink-2);font-family:var(--f-num)}
  .ios .weekrow__v{font-size:14px;font-weight:600;font-family:var(--f-num);text-align:right;min-width:56px}
  .ios .group-note{font-size:12px;color:var(--ink-3);margin:8px var(--gutter) 0}
  .ios .btn--filled{background:var(--tint);color:#fff;border:0}
  .ios .btn--pill{border-radius:999px}
  .ios .btn[disabled]{opacity:.4}

  /* foglio tastierino (stile iOS) */
  .kp-scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
  .kp-scrim.is-open{opacity:1;pointer-events:auto}
  .sheet2{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);
    border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line),0 -20px 40px rgba(0,0,0,.18);
    padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
  .sheet2.is-open{transform:none}
  .sheet2 .grab{width:36px;height:5px;border-radius:999px;background:var(--line-strong);margin:0 auto 12px}
  .sheet2 .kphead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:16px;border-bottom:.5px solid var(--line)}
  .sheet2 .kplabel{font-size:13px;color:var(--ink-soft)}
  .sheet2 .kpval{font-size:42px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
  .sheet2 .kpnow{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
  .sheet2 .kpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .sheet2 .kpgrid button{min-height:56px;border-radius:14px;background:var(--panel);font-size:26px;font-family:var(--mono);color:var(--ink)}

    let DB=null;

    /* ============================================================ helpers */
    const pad=n=>String(n).padStart(2,'0');
    function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
    function parseISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
    function aaLabel(startISO){
      if(!startISO)return '';
      const d=parseISO(startISO); if(isNaN(d))return '';
      const y=d.getFullYear(), m=d.getMonth();
      const s = m>=8 ? y : y-1;
      return s+' / '+(s+1);
    }
    function mondayOf(d){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x;}
    function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
    const DAYNAMES=['lunedì','martedì','mercoledì','giovedì','venerdì','sabato','domenica'];
    const MONTHS=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
    function t2m(t){if(!t)return null;const m=/^(\d{1,2}):(\d{2})$/.exec(String(t).trim());if(!m)return null;const h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return h*60+mi;}
    function normalizeTime(s){
      const d=String(s).replace(/\D/g,'').slice(0,4);
      if(!d)return '';
      let h,mi;
      if(d.length<=2){h=d;mi='00';}
      else{h=d.slice(0,d.length-2);mi=d.slice(-2);}
      h=pad(Math.min(23,parseInt(h,10)||0));
      mi=pad(Math.min(59,parseInt(mi,10)||0));
      return h+':'+mi;
    }
    function fmtHM(min,sign){
      if(min==null)return '—';
      const s=min<0?'-':(sign?'+':''); min=Math.abs(min);
      const h=Math.floor(min/60),m=min%60;
      return s+h+'h'+(m?pad(m):'00');
    }
    function periodFor(list,monISO){let chosen=list[0];for(const p of list){if(p.from<=monISO)chosen=p;else break;}return chosen;}
    function monOf(dISO){return iso(mondayOf(parseISO(dISO)));}
    function scheduleForWeek(mon){return (periodFor(DB.schedulePeriods,mon)||{}).schedule||{};}
    function studyScheduleForWeek(mon){return (periodFor(DB.studyPeriods,mon)||{}).schedule||{};}
    function presSlotsForWeek(mon){return (periodFor(DB.schedulePeriods,mon)||{}).slots||{};}
    function studySlotsForWeek(mon){return (periodFor(DB.studyPeriods,mon)||{}).slots||{};}
    function thisWeekMon(){return iso(mondayOf(new Date()));}
    function obligation(){return Object.values(scheduleForWeek(thisWeekMon())).reduce((a,b)=>a+(+b||0),0);}
    function expectedFor(date){return +scheduleForWeek(monOf(date))[parseISO(date).getDay()]||0;}
    function isSkipped(dISO){return !!DB.skipDays[dISO];}
    function obligationForWeek(mon){
      const sch=scheduleForWeek(mon); let s=0; const m=parseISO(mon);
      for(let i=0;i<7;i++){const d=addDays(m,i),k=iso(d); if(isSkipped(k))continue; s+=(+sch[d.getDay()]||0);}
      return s;
    }

    function studyDefaultFor(date){return +studyScheduleForWeek(monOf(date))[parseISO(date).getDay()]||0;}
    function workableForStudy(date,e){
      const expected=expectedFor(date), beh=ACTBY[e&&e.act]?.beh;
      return beh==='work'||beh==='hour'||beh==='special'||(!(e&&e.act)&&expected>0);
    }
    function dayStudyMin(date,e){
      if(!workableForStudy(date,e))return 0;
      return studyDefaultFor(date);
    }
    const AUTO_BREAK_THRESHOLD=432;
    const AUTO_BREAK=30;
    const DAILY_CAP=540;
    function presenceWork(e){
      const s1i=t2m(e&&e.m1in),s1o=t2m(e&&e.m1out),s2i=t2m(e&&e.m2in),s2o=t2m(e&&e.m2out);
      const span1=(s1i!=null&&s1o!=null)?Math.max(0,s1o-s1i):0;
      const span2=(s2i!=null&&s2o!=null)?Math.max(0,s2o-s2i):0;
      const gross=span1+span2, breakPunched=span1>0&&span2>0;
      let net=gross, autoBreak=0;
      if(!breakPunched && gross>AUTO_BREAK_THRESHOLD){
        autoBreak=Math.min(AUTO_BREAK, gross-AUTO_BREAK_THRESHOLD);
        net=gross-autoBreak;
      }
      return {gross,net,autoBreak,breakPunched};
    }
    function dayWorkInfo(date,e){
      /* lo studio NON entra nel totale: e' un contatore separato (weekStudy) */
      const study=dayStudyMin(date,e);
      const beh=ACTBY[e&&e.act]?.beh;
      const pw=presenceWork(e);
      let base;
      if(!e||!e.act) base=0;
      else if(beh==='work'||beh==='hour') base=pw.net;
      else if(beh==='special') base=(pw.net>0?pw.net:expectedFor(date));
      else base=0;
      const capped=Math.max(0, base-DAILY_CAP);
      return {study, pw, base, capped, cappedBase:Math.min(base,DAILY_CAP), beh, deducted:pw.autoBreak+capped};
    }
    function dayMinutes(date,e){
      if(e&&e.act){const beh=ACTBY[e.act]?.beh; if(beh==='day'||beh==='holiday')return expectedFor(date);}
      const info=dayWorkInfo(date,e);
      let total=info.cappedBase;
      if(e&&ACTBY[e.act]?.beh==='hour') total+=(+e.ph||0);
      return total;
    }
    function hasEntry(e){return e&&e.act;}

    function weeksWithData(){
      const set=new Set();
      Object.keys(DB.entries).forEach(d=>{ if(hasEntry(DB.entries[d])) set.add(iso(mondayOf(parseISO(d)))); });
      return [...set].sort();
    }
    function weekTotal(mon){
      let tot=0; for(let i=0;i<7;i++){const d=iso(addDays(parseISO(mon),i)); if(isSkipped(d))continue; tot+=dayMinutes(d,DB.entries[d]);}
      return tot;
    }
    function weekStudy(mon){
      let tot=0; for(let i=0;i<7;i++){const d=iso(addDays(parseISO(mon),i)); if(isSkipped(d))continue; tot+=dayStudyMin(d,DB.entries[d]);}
      return tot;
    }
    function weekExcessMin(mon){return Math.max(0,weekTotal(mon)-obligationForWeek(mon));}
    function authForWeek(mon){return Math.min(DB.authorized[mon]||0, weekExcessMin(mon));}
    function runningBalance(){
      let bal=DB.initialBalanceMin||0;
      weeksWithData().forEach(mon=>{
        const c=weekTotal(mon)-obligationForWeek(mon);
        if(c>0) bal += authForWeek(mon);
        else    bal += c;
      });
      return bal;
    }
    function usage(entId){
      const ent=DB.entitlements.find(x=>x.id===entId);
      const unit=ent?ent.unit:'GG';
      let used=0;
      Object.entries(DB.entries).forEach(([d,e])=>{
        if(!hasEntry(e))return;
        const a=ACTBY[e.act];
        /* GG: un giorno per voce; ORE: e.ph e' in minuti, il monte in ore */
        if(a&&a.ent===entId){ used += unit==='GG'?1:((+e.ph||0)/60); }
      });
      return used;
    }
    function omessaCount(){let n=0;Object.values(DB.entries).forEach(e=>{if(e&&e.act==='omessa')n++;});return n;}
    function ferieAlloc(){
      const prev=DB.entitlements.find(e=>e.id==='ferie_prec')||{total:0,used0:0};
      const cur=DB.entitlements.find(e=>e.id==='ferie')||{total:0,used0:0};
      const taken=usage('ferie');
      const prevAvail=Math.max(0,(prev.total||0)-(prev.used0||0));
      const fromPrev=Math.min(taken,prevAvail);
      const fromCur=taken-fromPrev;
      const prevUsed=(prev.used0||0)+fromPrev, curUsed=(cur.used0||0)+fromCur;
      return {prevUsed, prevRes:(prev.total||0)-prevUsed, curUsed, curRes:(cur.total||0)-curUsed, fromPrev, fromCur, taken};
    }
