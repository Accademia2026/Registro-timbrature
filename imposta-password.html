<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Registro presenze · Imposta password</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#F2F2F7;color:#000;display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);width:100%;max-width:380px;padding:32px 28px}
  h1{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:0 0 4px}
  .sub{font-size:13px;color:rgba(60,60,67,.6);margin:0 0 24px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:rgba(60,60,67,.6);margin:14px 0 5px}
  input{width:100%;font:inherit;font-size:16px;color:#000;background:#fff;border:1px solid rgba(60,60,67,.24);border-radius:10px;padding:11px 12px}
  input:focus{outline:none;border-color:#0B6CD9;box-shadow:0 0 0 3px rgba(11,108,217,.12)}
  button{width:100%;margin-top:22px;border:0;border-radius:999px;padding:13px;font:inherit;font-size:15px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#0B6CD9,#3f93e6)}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:16px;font-size:13.5px;border-radius:10px;padding:11px 13px;display:none}
  .msg.show{display:block}
  .msg.err{background:rgba(194,86,10,.12);color:#C2560A}
  .msg.ok{background:rgba(30,142,62,.12);color:#1E8E3E}
  .linkrow{text-align:center;margin-top:16px}
  .linkrow a{font-size:13px;color:#0B6CD9;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>Imposta la password</h1>
  <p class="sub" id="sub">Un momento…</p>
  <div id="box"></div>
  <div class="msg" id="msg"></div>
</div>

<script type="module">
import { supabase, configurata } from './js/supabase.js';
import { impostaPassword, msgErrore } from './js/auth.js';

const box = document.getElementById('box');
const sub = document.getElementById('sub');
const msg = document.getElementById('msg');
function say(testo, tipo){ msg.textContent = testo; msg.className = 'msg show ' + tipo; }

function vistaForm(email){
  sub.textContent = email ? ('Account: ' + email) : 'Scegli la password del tuo account';
  box.innerHTML = `
    <form id="f">
      <label for="pw1">Nuova password (min. 8 caratteri)</label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="pw2">Ripeti password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
      <button id="go">Salva e accedi</button>
    </form>`;
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    const p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
    if (p1 !== p2) return say('Le due password non coincidono.', 'err');
    const b = document.getElementById('go'); b.disabled = true;
    const { error } = await impostaPassword(p1);
    b.disabled = false;
    if (error) return say(msgErrore(error), 'err');
    say('Password impostata. Ti porto all’app…', 'ok');
    setTimeout(() => location.replace('index.html'), 1200);
  };
}

function vistaLinkNonValido(){
  sub.textContent = 'Link non valido o scaduto';
  box.innerHTML = `<p class="sub" style="margin:0">Apri di nuovo il link ricevuto per
    email. Se è passato troppo tempo, chiedi un nuovo invito oppure usa
    “Password dimenticata?” dalla pagina di accesso.</p>
    <div class="linkrow"><a href="index.html">← Vai all'accesso</a></div>`;
}

if (!configurata()) {
  sub.textContent = '';
  say('Configurazione mancante: incolla Project URL e Publishable key in js/supabase.js.', 'err');
} else {
  // Il link d'invito/reset arriva con il token nell'URL: il client lo consuma e
  // apre la sessione. Aspettiamo l'evento; se entro 3s non c'è sessione, il
  // link è stato già usato o è scaduto.
  let mostrato = false;
  const mostra = (session) => {
    if (mostrato || !session) return;
    mostrato = true;
    vistaForm(session.user?.email);
  };
  supabase.auth.onAuthStateChange((_evento, session) => mostra(session));
  const { data } = await supabase.auth.getSession();
  mostra(data?.session);
  setTimeout(() => { if (!mostrato) vistaLinkNonValido(); }, 3000);
}
</script>
</body>
</html>
